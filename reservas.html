<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Costa Vera | Reservaciones</title>

  <link rel="stylesheet" href="css/styles.css">

  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
</head>
<body>

  <header class="header">
    <div class="container nav">
      <div class="logo">Costa Vera</div>
      <nav>
        <ul class="nav-links">
          <li><a href="index.html">Inicio</a></li>
          <li><a href="menu.html">Menú</a></li>
          <li><a href="reservas.html">Reservar</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="reservas-page">

    <section class="reservas-hero">
      <div class="container">
        <h1>Reservaciones</h1>
        <p>Reserve su mesa y disfrute de una experiencia gastronómica exclusiva.</p>
      </div>
    </section>

    <section class="reservas-form-section">
      <div class="container">
        <form class="reservas-form">

          <div class="form-row">
            <div class="form-group">
              <label>Nombre</label>
              <input type="text" placeholder="Nombre completo" required>
            </div>

            <div class="form-group">
              <label>Teléfono</label>
              <input type="tel" placeholder="(787) 000-0000" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Fecha</label>
              <input type="date" required>
            </div>

            <div class="form-group">
              <label>Hora</label>
              <input type="time" required>
            </div>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label>Personas</label>
              <select required>
                <option value="">Seleccione</option>
                <option>1 persona</option>
                <option>2 personas</option>
                <option>3 personas</option>
                <option>4 personas</option>
                <option>5 personas</option>
                <option>6+ personas</option>
              </select>
            </div>

            <div class="form-group">
              <label>Área</label>
              <select>
                <option>Interior</option>
                <option>Terraza</option>
                <option>Frente al mar</option>
              </select>
            </div>
          </div>

          <div class="form-group">
            <label>Notas adicionales</label>
            <textarea rows="4" placeholder="Solicitudes especiales..."></textarea>
          </div>

          <button type="submit" class="btn-primary full">
            Confirmar Reservación
          </button>

        </form>
      </div>
    </section>

  </main>

  <footer class="footer" aria-label="Pie de página">
  <div class="social" aria-label="Redes sociales">
    <a
      href="https://www.facebook.com/share/1BkmiTHZhH/?mibextid=wwXIfr"
      target="_blank"
      rel="noopener"
      aria-label="Facebook de Raymond Develop"
      title="Facebook"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M14 8.5V7.2c0-.9.6-1.2 1.2-1.2H17V3h-2.2C12.7 3 12 4.3 12 6.2v2.3H10v3h2V21h3v-9.5h2.3l.7-3H15Z"
              fill="white" fill-opacity=".92"/>
      </svg>
    </a>

    <a
      href="https://www.instagram.com/raymonddevelop?igsh=MXF5cGNqOG11cG5yZg=="
      target="_blank"
      rel="noopener"
      aria-label="Instagram de Raymond Develop"
      title="Instagram"
    >
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M7.5 3h9A4.5 4.5 0 0 1 21 7.5v9A4.5 4.5 0 0 1 16.5 21h-9A4.5 4.5 0 0 1 3 16.5v-9A4.5 4.5 0 0 1 7.5 3Z"
              stroke="white" stroke-opacity=".92" stroke-width="1.8"/>
        <path d="M12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8Z"
              stroke="white" stroke-opacity=".92" stroke-width="1.8"/>
        <path d="M17.3 6.9h.01"
              stroke="white" stroke-opacity=".92" stroke-width="2.6" stroke-linecap="round"/>
      </svg>
    </a>
  </div>

  <div class="copyright">
    © <span id="year"></span>
    <a
      href="https://raymonddevelop.com"
      target="_blank"
      rel="noopener"
      class="copyright-link"
    >
      Raymond Develop
    </a>
  </div>
</footer>

<script>
  document.getElementById("year").textContent = new Date().getFullYear();
</script>

</body>
</html>
